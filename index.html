<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Designer Digital • Rádio & Versículos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Compat SDKs (App & Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #151c2f 50%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Container Central da Página -->
    <main class="w-full max-w-md mx-auto space-y-6 my-auto">
        
        <!-- Bloco de Perfil / Identidade -->
        <header class="text-center space-y-3">
            <div class="w-24 h-24 mx-auto rounded-full p-1 bg-gradient-to-tr from-amber-500 via-orange-500 to-indigo-600 shadow-2xl">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Max Designer Digital" class="w-full h-full object-cover rounded-full">
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Max Designer Digital</h1>
                <p class="text-xs uppercase tracking-widest text-amber-400 font-semibold mt-1">Palmas, TO • @maxwellber_63</p>
            </div>
        </header>

        <!-- Seção 1: Rádio Sertanejo Raiz (Clássicos Nacionais) -->
        <section class="glass-card rounded-2xl p-5 space-y-4 transition-all duration-300">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3.5">
                    <!-- Indicador Visual de Transmissão -->
                    <div class="relative flex h-3.5 w-3.5 items-center justify-center">
                        <span id="radio-pulse" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75 hidden"></span>
                        <span id="radio-dot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
                    </div>
                    <div>
                        <h2 class="font-semibold text-sm text-amber-400">Rádio Sertanejo Raiz</h2>
                        <p id="radio-status" class="text-xs text-slate-400">Ouça os clássicos nacionais</p>
                    </div>
                </div>
                <!-- Botão Play/Pause com Feedback Tátil -->
                <button id="play-btn" onclick="toggleRadioPlayer()" aria-label="Controlar Rádio" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold p-3 rounded-full shadow-lg transition-transform transform active:scale-90 flex items-center justify-center w-11 h-11">
                    ▶
                </button>
            </div>
            <!-- Elemento de Áudio (Stream ao Vivo) -->
            <audio id="sertanejo-audio" preload="none">
                <source src="https://player.painelcast.com:8432/live" type="audio/mpeg">
                Seu navegador não suporta áudio HTML5.
            </audio>
        </section>

        <!-- Seção 2: Versículos Bíblicos Infinitos (Integrado ao Firebase Firestore) -->
        <section class="glass-card rounded-2xl p-6 space-y-4 text-center relative overflow-hidden">
            <!-- Barra Decorativa Superior -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-500 via-indigo-500 to-purple-500"></div>
            
            <div class="flex justify-between items-center text-[11px] text-slate-400">
                <span class="uppercase tracking-wider font-bold text-indigo-400 flex items-center gap-1">
                    📖 Palavra Viva
                </span>
                <span class="bg-slate-800/90 px-2.5 py-1 rounded-full text-slate-300 border border-slate-700/50">
                    Auto (15s) ↻
                </span>
            </div>

            <!-- Caixa de Exibição do Versículo -->
            <div class="min-h-[110px] flex flex-col justify-center items-center space-y-2.5 px-2">
                <p id="bible-verse" class="text-sm md:text-base italic text-slate-200 leading-relaxed transition-opacity duration-500">
                    "Carregando mensagens bíblicas..."
                </p>
                <p id="bible-ref" class="text-xs font-semibold text-amber-400 transition-opacity duration-500"></p>
            </div>

            <!-- Botão de Ação Manual -->
            <div class="pt-1">
                <button onclick="fetchNextVerseManual()" class="w-full bg-slate-800/80 hover:bg-slate-700 text-xs py-2.5 px-4 rounded-xl border border-slate-700 transition font-medium text-indigo-300 hover:text-indigo-200 flex items-center justify-center gap-2">
                    <span>Próximo Versículo</span>
                    <span class="text-amber-400">→</span>
                </button>
            </div>
        </section>

        <!-- Seção 3: Atalhos e Redes Sociais -->
        <nav class="space-y-3">
            <a href="https://instagram.com/maxwellber_63" target="_blank" rel="noopener noreferrer" class="glass-card flex items-center justify-center space-x-2 w-full py-3.5 px-4 rounded-xl font-medium hover:bg-slate-800/80 transition-all duration-200 text-sm">
                <span>📸</span>
                <span>Instagram Profissional</span>
            </a>
            <a href="https://wa.me/5563900000000" target="_blank" rel="noopener noreferrer" class="glass-card flex items-center justify-center space-x-2 w-full py-3.5 px-4 rounded-xl font-medium hover:bg-slate-800/80 transition-all duration-200 text-sm">
                <span>💬</span>
                <span>Orçamentos via WhatsApp</span>
            </a>
        </nav>

    </main>

    <!-- Rodapé -->
    <footer class="mt-8 text-center text-xs text-slate-500">
        <p>© 2026 Max Designer Digital • Todos os direitos reservados.</p>
    </footer>

    <!-- Lógica JavaScript Reforçada e Organizada -->
    <script>
        /* ==========================================================
           1. CONFIGURAÇÃO DO FIREBASE (FIRESTORE)
           Substitua com as credenciais do seu console Firebase
           ========================================================== */
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-projeto-id",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicialização Segura do Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        /* ==========================================================
           2. SISTEMA DE VERSÍCULOS BÍBLICOS (FIREBASE + INFINITO)
           ========================================================== */
        // Fallback local caso o Firebase demore ou esteja offline
        const fallbackVerses = [
            { text: "O Senhor é o meu pastor; nada me faltará.", ref: "Salmos 23:1" },
            { text: "Tudo posso naquele que me fortalece.", ref: "Filipenses 4:13" },
            { text: "Entrega o teu caminho ao Senhor; confia nele, e ele o fará.", ref: "Salmos 37:5" },
            { text: "Lâmpada para os meus pés é a palavra tua, e luz para o meu caminho.", ref: "Salmos 119:105" },
            { text: "Confia no Senhor de todo o teu coração e não te estribes no teu próprio entendimento.", ref: "Provérbios 3:5" }
        ];

        let versesDatabase = [];
        let currentVerseIndex = 0;
        let verseTimer = null;

        // Função assíncrona para buscar dados na coleção 'versiculos' do Firestore
        async function loadVersesCollection() {
            try {
                const querySnapshot = await db.collection("versiculos").get();
                if (!querySnapshot.empty) {
                    versesDatabase = [];
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        // Garante compatibilidade com os nomes dos campos salvos
                        versesDatabase.push({
                            text: data.text || data.versiculo,
                            ref: data.ref || data.referencia
                        });
                    });
                } else {
                    versesDatabase = fallbackVerses;
                }
            } catch (error) {
                console.warn("Aviso: Utilizando banco de versículos local (Modo Fallback). Erro:", error);
                versesDatabase = fallbackVerses;
            }
            renderCurrentVerse();
            initInfiniteVerseRotation();
        }

        // Renderiza o versículo atual na tela com efeito suave
        function renderCurrentVerse() {
            if (versesDatabase.length === 0) return;
            
            const verseBox = document.getElementById('bible-verse');
            const refBox = document.getElementById('bible-ref');

            // Aplica efeito de transição suave
            verseBox.style.opacity = '0';
            refBox.style.opacity = '0';

            setTimeout(() => {
                const current = versesDatabase[currentVerseIndex];
                verseBox.innerText = `"${current.text}"`;
                refBox.innerText = `— ${current.ref}`;
                
                verseBox.style.opacity = '1';
                refBox.style.opacity = '1';

                // Avança para o próximo índice de forma infinita (loop circular)
                currentVerseIndex = (currentVerseIndex + 1) % versesDatabase.length;
            }, 250);
        }

        // Passa o versículo manualmente e reinicia o temporizador automático
        function fetchNextVerseManual() {
            renderCurrentVerse();
            resetInfiniteVerseRotation();
        }

        // Gerencia a rotação automática contínua (a cada 15 segundos)
        function initInfiniteVerseRotation() {
            if (verseTimer) clearInterval(verseTimer);
            verseTimer = setInterval(() => {
                renderCurrentVerse();
            }, 15000);
        }

        // Reseta o ciclo automático para evitar conflito com o clique manual
        function resetInfiniteVerseRotation() {
            initInfiniteVerseRotation();
        }

        /* ==========================================================
           3. PLAYER DE RÁDIO SERTANEJO RAIZ (CLÁSSICOS NACIONAIS)
           ========================================================== */
        const radioAudio = document.getElementById('sertanejo-audio');
        const playButton = document.getElementById('play-btn');
        const radioStatusText = document.getElementById('radio-status');
        const radioPulseEffect = document.getElementById('radio-pulse');
        let isRadioPlaying = false;

        function toggleRadioPlayer() {
            if (isRadioPlaying) {
                radioAudio.pause();
                playButton.innerHTML = "▶";
                radioStatusText.innerText = "Ouça os clássicos nacionais";
                radioPulseEffect.classList.add('hidden');
                isRadioPlaying = false;
            } else {
                radioStatusText.innerText = "Conectando ao sertanejo raiz...";
                radioAudio.play().then(() => {
                    playButton.innerHTML = "⏸";
                    radioStatusText.innerText = "AO VIVO: Clássicos Sertanejos";
                    radioPulseEffect.classList.remove('hidden');
                    isRadioPlaying = true;
                }).catch((error) => {
                    console.error("Erro ao iniciar transmissão da rádio:", error);
                    radioStatusText.innerText = "Erro no stream. Tente novamente.";
                    playButton.innerHTML = "▶";
                    isRadioPlaying = false;
                });
            }
        }

        // Inicialização Geral da Página
        window.addEventListener('DOMContentLoaded', () => {
            loadVersesCollection();
        });
    </script>
</body>
</html>
